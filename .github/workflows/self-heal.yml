name: Cloud self-healing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'logs/**'
      - '**.md'
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: cloud-self-healing-main
  cancel-in-progress: false
jobs:
  diagnose-repair-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_PROVIDER: mock
      AUTO_PUSH_FIXES: '1'
      VERCEL_MONITOR_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure repair commit identity
        run: |
          git config user.name 'KhataWise Healing Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Diagnose, repair known expense regression, and verify
        run: python cloud_healer.py
      - name: Verify bridge and web recovery interface
        if: always()
        run: |
          python -m unittest test_vercel_bridge -v
          python manage.py test khaatawise --noinput
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-recovery-report
          path: cloud-recovery-report.json
